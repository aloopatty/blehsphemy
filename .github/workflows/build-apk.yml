name: Build StudyGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive
        run: |
          if [ ! -f studygram-source.zip ]; then
            echo "::error::Missing studygram-source.zip. Upload the source archive to the repository root first."
            echo "Repository currently contains workflow configuration only."
            exit 1
          fi
      - name: Extract source archive
        run: unzip -q studygram-source.zip
      - name: Repair source archive issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          slash = chr(92)
          feed = Path("studygram/lib/features/feed/feed_screen.dart")
          source = feed.read_text()
          source = source.replace(";" + slash + "nimport", ";" + chr(10) + "import", 1)
          feed.write_text(source)

          test = Path("studygram/test/parser_test.dart")
          source = test.read_text().replace(slash + slash + "n", slash + "n")
          lines = source.splitlines()
          for index, line in enumerate(lines):
              if "archive.addFile(ArchiveFile('ppt/slides/slide1.xml'" in line:
                  prefix = "utf8.encode("
                  expression = line[line.index(prefix) + len(prefix):-4]
                  lines[index] = "      final xmlBytes = utf8.encode(" + expression + ");"
                  lines.insert(index + 1, "      archive.addFile(ArchiveFile('ppt/slides/slide1.xml', xmlBytes.length, xmlBytes));")
                  break
          test.write_text("\n".join(lines) + "\n")
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: studygram
        run: flutter pub get
      - name: Analyze
        working-directory: studygram
        run: flutter analyze
      - name: Test
        working-directory: studygram
        run: flutter test
      - name: Build release APK
        working-directory: studygram
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: studygram-release-apk
          path: studygram/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
