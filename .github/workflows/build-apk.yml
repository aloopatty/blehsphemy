name: Build StudyGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source archive
        run: test -s studygram-source.zip

      - name: Extract source
        run: unzip -q studygram-source.zip

      - name: Apply source fixes and compatibility imports
        working-directory: studygram
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Repair the archive's malformed literal newline between the first imports.
          feed = Path("lib/features/feed/feed_screen.dart")
          feed.write_text(feed.read_text().replace(chr(92) + "n", chr(10)))

          # Correct the PPTX test fixture's ArchiveFile constructor.
          test = Path("test/parser_test.dart")
          lines = test.read_text().splitlines()
          for i, line in enumerate(lines):
              if "archive.addFile(ArchiveFile('ppt/slides/slide1.xml'" in line:
                  xml = "<p:sld xmlns:p='http://schemas.openxmlformats.org/presentationml/2006/main' xmlns:a='http://schemas.openxmlformats.org/drawingml/2006/main'><a:t>Slide title</a:t><a:t>Bullet point</a:t></p:sld>"
                  lines[i:i+1] = [
                      '      final xmlBytes = utf8.encode("' + xml + '");',
                      "      archive.addFile(ArchiveFile('ppt/slides/slide1.xml', xmlBytes.length, xmlBytes));",
                  ]
                  break
          else:
              raise SystemExit("PPTX test fixture pattern was not found")
          test.write_text(chr(10).join(lines) + chr(10))

          # Remove deprecated duplicate ColorScheme.background while retaining surface.
          theme = Path("lib/core/theme/app_theme.dart")
          theme.write_text(theme.read_text().replace("      background: background," + chr(10), ""))

          switcher = Path("lib/features/accounts/account_switcher.dart")
          switcher.write_text(switcher.read_text().replace(".length].value);", ".length].toARGB32());"))

          profile = Path("lib/features/profile/profile_screen.dart")
          profile.write_text(profile.read_text().replace("import '../feed/models.dart';" + chr(10), "").replace("import '../feed/feed_screen.dart';" + chr(10), ""))
          main = Path("lib/main.dart")
          main.write_text(main.read_text().replace("import 'core/theme/app_theme.dart';" + chr(10), ""))

          # Flutter 3.50+ moved Material widgets to the standalone package.
          for root in (Path("lib"), Path("test")):
              for dart_file in root.rglob("*.dart"):
                  text = dart_file.read_text().replace("package:flutter/material.dart", "package:material_ui/material_ui.dart")
                  dart_file.write_text(text)

          # Replace flutter create's placeholder test with an app smoke test.
          Path("test/widget_test.dart").write_text("""import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:hive/hive.dart';
          import 'package:studygram/core/storage/study_store.dart';
          import 'package:studygram/features/app/studygram_app.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();
            testWidgets('StudyGram root renders', (tester) async {
              final dir = await Directory.systemTemp.createTemp('studygram-test-');
              Hive.init(dir.path);
              await StudyStore.initialize();
              await tester.pumpWidget(const ProviderScope(child: StudyGramApp()));
              await tester.pump();
              expect(find.byType(StudyGramApp), findsOneWidget);
              await Hive.close();
              await dir.delete(recursive: true);
            });
          }
          """)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Add Material UI dependency
        working-directory: studygram
        run: flutter pub add material_ui

      - name: Generate Android platform scaffold
        working-directory: studygram
        run: flutter create --platforms=android --project-name studygram --no-pub .

      - name: Flutter dependencies
        working-directory: studygram
        run: flutter pub get

      - name: Analyze
        working-directory: studygram
        run: flutter analyze

      - name: Test
        working-directory: studygram
        run: flutter test

      - name: Build release APK
        working-directory: studygram
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: studygram-release-apk
          path: studygram/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
