name: Build StudyGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source archive
        run: test -s studygram-source.zip

      - name: Extract source
        run: unzip -q studygram-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform scaffold
        working-directory: studygram
        run: flutter create --platforms=android --project-name studygram .

      - name: Flutter dependencies
        working-directory: studygram
        run: flutter pub get

      - name: Analyze
        working-directory: studygram
        run: flutter analyze

      - name: Test
        working-directory: studygram
        run: flutter test

      - name: Build release APK
        working-directory: studygram
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: studygram-release-apk
          path: studygram/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
