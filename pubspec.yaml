name: studygram
description: An offline-first visual study feed for academic subjects.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.1.2
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdf: ^35.2.13
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
